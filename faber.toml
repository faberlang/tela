[package]
name = "tela"
version = "0.0.0"
edition = "2026"

[library]
provider = "tela"

[paths]
source = "src"

[build]
kind = "lib"
targets = ["rust", "ts"]

# Web-surface-import U2 (web-import-u2-tela-dom-runtime-bindings): the
# tela:dom host binding — the emitted tela:dom references resolve to the
# tela-owned runtime via this bindings file (the faber-web [target.ts]
# shape; DELIVERY.md §U2).
[target.ts]
bindings = "bindings/ts.toml"

[reader]
locale = "en"
