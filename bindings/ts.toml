# tela:canvas2d — the Canvas2D drawing-surface binding (web-surface-import
# U3, web-import-u3-tela-canvas2d; DELIVERY.md §U3). The per-stem shim:
# stems without an entry fall back to the package-level [shim] (dom); the
# canvas2d stem wires to its own runtime shim. Every tela:canvas2d route
# mirrors one `fn` in src/canvas2d.fab and one exported function in
# runtime/canvas2d.ts (the `webCanvas2d*` symbols are KEPT — the
# documented host-binding contract). The opener/result fields are en Faber
# type names taken from the fn signature (`f64` is a language scalar width
# spelling — never localizes); tests/contract-test.ts verifies the
# bijection mechanically.

[shims.canvas2d]
path = "runtime/canvas2d.ts"

[functions."tela:canvas2d.canvas2d_context"]
symbol = "webCanvas2dContext"
opener = "Element"
result = "Canvas2DContext"

[functions."tela:canvas2d.canvas2d_save"]
