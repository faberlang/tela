[package]
name = "vox-app"
version = "0.0.0"
edition = "2026"

[paths]
source = "src"
entry = "main.fab"

[build]
target = "ts"
kind = "bin"

[product]
kind = "browser-app"
emit = "typescript"
out = "dist"
templates = "pages"
styles = "styles"
controllers_json = "controllers.json"

[product.audio_worklet]
entry = "src/worklet.fab"
processor = "vox-voice"

[dependencies]
tela = "0.0.0"
engine = "0.0.0"

[locale]
locale = "en"
