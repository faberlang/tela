[package]
name = "gap28"
version = "0.0.0"
edition = "2026"

[paths]
entry = "main.fab"

[build]
target = "ts"
kind = "bin"

[product]
kind = "browser-app"
emit = "typescript"
out = "dist"
templates = "pages"
styles = "styles"
controllers_json = "controllers.json"

[dependencies]
tela = "0.0.0"

[locale]
locale = "en"
