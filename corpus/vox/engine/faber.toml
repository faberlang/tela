[package]
name = "vox-engine"
version = "0.0.0"
edition = "2026"

[library]
provider = "engine"

[paths]
source = "src"
# gap 27: a locked path library's sibling imports resolve only through
# library_home on the browser-app product emit.
library_home = ".."

[build]
kind = "lib"
targets = ["rust", "ts"]

[locale]
locale = "en"
